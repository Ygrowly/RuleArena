[project]
name = "rulearena"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "rulearena-attack-runtime",
  "rulearena-attack-worker",
  "rulearena-commerce-sandbox",
  "rulearena-control-api",
  "rulearena-domain-contracts",
  "rulearena-evaluation",
  "rulearena-observability",
  "rulearena-oracle",
  "rulearena-policy-schema",
  "rulearena-reference-simulator",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1,<0.29",
  "mypy>=1.17.1,<2",
  "pytest>=8.4.1,<9",
  "pytest-asyncio>=1.1.0,<2",
  "ruff>=0.12.11,<0.13",
]

[tool.uv.workspace]
members = [
  "packages/attack_runtime",
  "packages/domain_contracts",
  "packages/evaluation",
  "packages/observability",
  "packages/oracle",
  "packages/policy_schema",
  "packages/reference_simulator",
  "services/commerce_sandbox",
  "services/attack_worker",
  "services/control_api",
]

[tool.uv.sources]
rulearena-attack-runtime = { workspace = true }
rulearena-attack-worker = { workspace = true }
rulearena-commerce-sandbox = { workspace = true }
rulearena-control-api = { workspace = true }
rulearena-domain-contracts = { workspace = true }
rulearena-evaluation = { workspace = true }
rulearena-observability = { workspace = true }
rulearena-oracle = { workspace = true }
rulearena-policy-schema = { workspace = true }
rulearena-reference-simulator = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
asyncio_mode = "auto"
markers = [
  "postgres: requires the local PostgreSQL container",
  "sandbox: requires the real Commerce Sandbox HTTP service",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# Alembic requires every environment file to be named env.py, which mypy cannot
# disambiguate across control/sandbox migration packages; DDL scripts are checked
# by alembic itself against a live database.
exclude = "^migrations/"

[[tool.mypy.overrides]]
module = ["redis.*"]
ignore_missing_imports = true
