name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      POSTGRES_ADMIN_USER: rulearena_admin
      POSTGRES_ADMIN_PASSWORD: ci-admin-password
      CONTROL_DB_PASSWORD: ci-control-password
      SANDBOX_DB_PASSWORD: ci-sandbox-password
      CONTROL_DATABASE_URL: postgresql+asyncpg://rulearena_control:ci-control-password@127.0.0.1:5432/rulearena
      SANDBOX_DATABASE_URL: postgresql+asyncpg://rulearena_sandbox:ci-sandbox-password@127.0.0.1:5432/rulearena
      TEST_CONTROL_DATABASE_URL: postgresql+asyncpg://rulearena_control:ci-control-password@127.0.0.1:5432/rulearena
      TEST_SANDBOX_DATABASE_URL: postgresql+asyncpg://rulearena_sandbox:ci-sandbox-password@127.0.0.1:5432/rulearena
      REDIS_URL: redis://127.0.0.1:6379/0
      INTERNAL_SERVICE_TOKEN: ci-token-that-is-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.11.19", enable-cache: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - uses: pnpm/action-setup@v4
        with: {version: "10.15.0", run_install: false}
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run mypy services packages scripts
      - run: uv run pytest -q
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm lint
        working-directory: frontend
      - run: pnpm typecheck
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - run: docker compose config --quiet
      - run: docker compose up -d --wait postgres redis
      - run: uv run alembic -c alembic.ini upgrade head
      - run: uv run alembic -c alembic-sandbox.ini upgrade head
      - run: uv run pytest -q tests/test_database_isolation.py
