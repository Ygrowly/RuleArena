[project]
name = "rulearena-runtime-gate"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28.1,<0.29",
  "rulearena-domain-contracts",
  "rulearena-reference-simulator",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rulearena_runtime_gate"]

[tool.uv.sources]
rulearena-domain-contracts = { workspace = true }
rulearena-reference-simulator = { workspace = true }
