[project]
name = "rulearena-oracle"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "rulearena-domain-contracts",
  "rulearena-policy-schema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rulearena_oracle"]

[tool.uv.sources]
rulearena-domain-contracts = { workspace = true }
rulearena-policy-schema = { workspace = true }
