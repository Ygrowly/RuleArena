[project]
name = "rulearena-domain-contracts"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.11.7,<3",
  "rulearena-policy-schema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rulearena_domain_contracts"]

[tool.uv.sources]
rulearena-policy-schema = { workspace = true }

