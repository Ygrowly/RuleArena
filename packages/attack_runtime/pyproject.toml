[project]
name = "rulearena-attack-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28.1,<0.29",
  "rulearena-oracle",
  "rulearena-policy-schema",
  "rulearena-reference-simulator",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rulearena_attack_runtime"]

[tool.uv.sources]
rulearena-oracle = { workspace = true }
rulearena-policy-schema = { workspace = true }
rulearena-reference-simulator = { workspace = true }
