server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Docker's embedded DNS. Resolving the name into a variable makes nginx look it up
        # per request instead of pinning whatever address it saw at startup, so recreating
        # a backend container no longer leaves the front door answering 502 until nginx is
        # restarted too.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream control-api:8000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
