[project]
name = "rulearena-attack-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "arq>=0.28,<0.29",
  "redis>=5.0.8,<6",
  "rulearena-attack-runtime",
  "rulearena-observability",
]

[project.scripts]
rulearena-attack-worker = "rulearena_attack_worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rulearena_attack_worker"]

[tool.uv.sources]
rulearena-attack-runtime = { workspace = true }
rulearena-observability = { workspace = true }
